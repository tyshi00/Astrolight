name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build release APK
        env:
          GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: ./gradlew :tool:assembleRelease
      - name: Find and rename APK
        run: |
          echo "All APKs found:"
          find tool/build/outputs -name "*.apk"
          APK=$(find tool/build/outputs -name "*.apk" | head -1)
          echo "Using: $APK"
          cp "$APK" astrolight-${{ github.ref_name }}.apk
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: astrolight-${{ github.ref_name }}.apk
          draft: false
          body: |
            ## AstroLight ${{ github.ref_name }}

            See [README](https://github.com/tyshi00/AstroLight#readme) for full feature list.
